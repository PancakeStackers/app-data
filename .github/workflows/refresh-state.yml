name: Refresh state legislature data

on:
  schedule:
    - cron: '27 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build state files
        env:
          OPEN_STATES_API_KEY: ${{ secrets.OPEN_STATES_API_KEY }}
        run: python -u build_state.py
      - name: Save the new files
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf "$RUNNER_TEMP/states"
          cp -r states "$RUNNER_TEMP/states"
          git fetch origin main
          git reset --hard origin/main
          rm -rf states
          cp -r "$RUNNER_TEMP/states" states
          git add states
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh state legislature data"
            git push origin HEAD:main
          fi
