name: Refresh vote data

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data file
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python -u build_data.py
      - name: Save the new data file
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          cp data.json "$RUNNER_TEMP/data.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/data.json" data.json
          git add data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh vote data"
            git push origin HEAD:main
          fi
